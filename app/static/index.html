<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aaj Kya Banega</title>
<style>
  :root {
    --bg: #faf7f2; --panel: #ffffff; --ink: #24201b; --muted: #6d655b;
    --line: #e5ded3; --accent: #b4552d; --accent-soft: #fdf0e9;
    --ok: #2f6b4f; --warn: #8a6d1f; --err: #a33a2a;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17150f; --panel: #201d17; --ink: #efe9e0; --muted: #a79d90;
      --line: #35302a; --accent: #e08152; --accent-soft: #2c211a;
      --ok: #7fc0a0; --warn: #d6b45c; --err: #e08b7b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.875rem; margin: 0 0 20px; }
  /* Two panes. minmax(0, 1fr) on the right column is load-bearing: without
     it a long <pre> in the raw-response block widens the grid instead of
     scrolling inside it. */
  .cols {
    display: grid; grid-template-columns: 340px minmax(0, 1fr);
    gap: 18px; align-items: start;
  }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; margin-bottom: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  label { display: block; font-size: 0.75rem; text-transform: uppercase;
          letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit;
  }
  textarea { resize: vertical; }
  .field { flex: 1 1 120px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px;
    padding: 10px 16px; border: 1px solid transparent;
    background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .note { font-size: 0.85rem; color: var(--muted); }
  .err { color: var(--err); }
  .recipe h2 { margin: 0 0 4px; font-size: 1.25rem; }
  .meta { color: var(--muted); font-size: 0.875rem; margin-bottom: 16px; }
  .sec { margin-top: 18px; }
  .sec:first-child { margin-top: 0; }
  .sec h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  ul, ol { margin: 0; padding-left: 20px; }
  li { margin-bottom: 6px; }
  .chip {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 0.75rem; font-weight: 600; background: var(--accent-soft);
    color: var(--accent); margin-right: 6px;
  }
  .missing { background: var(--accent-soft); border-left: 3px solid var(--accent);
             padding: 10px 12px; border-radius: 0 8px 8px 0; }
  audio { width: 100%; margin-top: 12px; }
  .spinner {
    width: 14px; height: 14px; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%;
    display: inline-block; animation: spin 0.8s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
  pre { overflow-x: auto; font-size: 0.75rem; background: var(--bg);
        padding: 10px; border-radius: 8px; border: 1px solid var(--line); }

  /* -- left pane ------------------------------------------------------- */
  /* The two blocks are titled, not merely coloured: which half of the page
     is the model's context and which is the reader's dashboard has to
     survive a screenshot. */
  .block-title { font-size: 0.95rem; font-weight: 700; margin: 0 0 2px; }
  .block-why { font-size: 0.78rem; color: var(--muted); margin: 0 0 14px; }
  .person { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  .person:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .person b { font-size: 0.95rem; }
  .tags { font-size: 0.8rem; color: var(--muted); }
  .tag-strong { color: var(--err); font-weight: 600; }
  .signal { font-size: 0.87rem; margin-bottom: 8px; }
  .signal .when { color: var(--muted); font-size: 0.78rem; }
  .signal.expired { opacity: 0.55; }
  .signal.expired s { text-decoration: line-through; }
  .stock { display: flex; justify-content: space-between; gap: 10px;
           font-size: 0.87rem; padding: 3px 0; }
  .stock .q { color: var(--muted); white-space: nowrap; }
  .stock.changed .q { color: var(--ok); font-weight: 600; }
  .money { display: flex; justify-content: space-between; font-size: 0.87rem; padding: 2px 0; }
  .money b { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Aaj Kya Banega</h1>
  <p class="sub">Pick a household, generate a recipe against what is actually in its kitchen, and hear it read to the cook.</p>

  <div class="panel">
    <div class="row">
      <div class="field" style="flex:2 1 200px"><label for="household">Household</label>
        <select id="household"><option value="">loading…</option></select></div>
      <div class="field"><label for="servings">Servings</label><input id="servings" type="number" value="2" min="1" /></div>
      <div class="field"><label for="guests">Guests</label><input id="guests" type="number" value="0" min="0" max="18" /></div>
      <div class="field"><label for="minutes">Minutes</label><input id="minutes" type="number" value="45" min="1" max="360" /></div>
      <div class="field"><label for="urgency">Urgency</label>
        <select id="urgency"><option>routine</option><option>urgent</option></select></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="field" style="flex:1 1 100%"><label for="apikey">API key (only if HOUSEHOLD_API_KEY is set)</label>
        <input id="apikey" type="password" placeholder="leave blank for local runs" autocomplete="off" /></div>
    </div>
    <div class="actions">
      <button id="go">Generate recipe</button>
      <span id="status" class="note"></span>
    </div>
  </div>

  <div class="cols">
    <aside id="left"></aside>
    <main id="right"></main>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var left = $("left"), right = $("right");
  var statusEl = $("status"), goBtn = $("go"), householdSel = $("household");

  // Remembered per browser only. It never reaches the server except as the
  // X-API-Key header, and it is a demo credential protecting a demo database.
  try {
    var saved = localStorage.getItem("household-api-key");
    if (saved) { $("apikey").value = saved; }
  } catch (e) { /* private mode: the field just starts empty */ }

  function rememberKey() {
    try { localStorage.setItem("household-api-key", $("apikey").value.trim()); } catch (e) { /* ignore */ }
  }

  function headers() {
    var h = { "Content-Type": "application/json" };
    var key = $("apikey").value.trim();
    if (key) { h["X-API-Key"] = key; }
    return h;
  }

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function setStatus(text, busy) {
    statusEl.innerHTML = busy ? '<span class="spinner"></span> ' + esc(text) : esc(text);
    statusEl.className = "note";
  }

  function fail(text) { statusEl.textContent = text; statusEl.className = "note err"; }

  async function detail(response) {
    try {
      var body = await response.json();
      if (typeof body.detail === "string") { return body.detail; }
      if (body.detail && body.detail.message) { return body.detail.message; }
      return JSON.stringify(body.detail || body);
    } catch (e) { return "HTTP " + response.status; }
  }

  async function getJSON(path) {
    var response = await fetch(path, { headers: headers() });
    if (!response.ok) { throw new Error(await detail(response)); }
    return response.json();
  }

  function money(value) {
    return "₹" + Number(value).toLocaleString("en-IN", { maximumFractionDigits: 0 });
  }

  function list(values, className) {
    if (!values || !values.length) { return ""; }
    return '<span class="' + className + '">' + values.map(esc).join(", ") + "</span>";
  }

  // -- household picker ------------------------------------------------
  //
  // Names, not ids. A judge never has to know whether a freshly seeded
  // database numbered its households 1-3 or 4-6, and a restart that
  // renumbers them cannot break the page.

  function selectedHousehold() {
    return householdSel.value ? Number(householdSel.value) : null;
  }

  async function loadHouseholds() {
    try {
      var rows = await getJSON("/api/households");
    } catch (error) {
      householdSel.innerHTML = '<option value="">' + esc(error.message) + "</option>";
      // 401 before a key is typed is expected, not a failure. Retry when one
      // arrives rather than making the reader reload the page.
      return;
    }
    if (!rows.length) {
      householdSel.innerHTML = '<option value="">no households seeded</option>';
      return;
    }
    householdSel.innerHTML = rows.map(function (row) {
      return '<option value="' + esc(row.id) + '">' + esc(row.name) + "</option>";
    }).join("");
    refreshLeft();
  }

  // -- left pane: the household, in two clearly separated halves --------

  async function refreshLeft() {
    var hid = selectedHousehold();
    if (hid === null) { left.innerHTML = ""; return; }
    // Budget and inventory are fetched separately from the context on
    // purpose: /context is the model's view and deliberately contains no
    // money and no stock levels. Settled for them here, labelled apart.
    var results = await Promise.all([
      getJSON("/api/households/" + hid + "/context").catch(function () { return null; }),
      getJSON("/api/households/" + hid + "/budget").catch(function () { return null; }),
      getJSON("/api/households/" + hid + "/inventory").catch(function () { return []; })
    ]);
    renderLeft(results[0], results[1], results[2]);
  }

  function renderLeft(ctx, budget, inventory) {
    left.innerHTML = contextMarkup(ctx) + dashboardMarkup(budget, inventory);
  }

  function contextMarkup(ctx) {
    if (!ctx) { return '<div class="panel"><p class="note">Could not load this household.</p></div>'; }
    var html = '<div class="panel">';
    html += '<p class="block-title">What the model was sent</p>';
    html += '<p class="block-why">Exactly the household memory in the prompt — same code path, so this cannot drift from it.</p>';

    html += '<div class="sec"><h3>Cook</h3>';
    html += "<p class=\"tags\">" + esc(ctx.cook.name) + " · " + esc(ctx.cook.language) +
            " · " + esc(ctx.cook.skill_level) + "</p></div>";

    html += '<div class="sec"><h3>Who is eating</h3>';
    ctx.members.forEach(function (m) {
      html += '<div class="person"><b>' + esc(m.name) + "</b> ";
      html += '<span class="tags">' + esc(m.language) + "</span><br />";
      var bits = [];
      if (m.health_constraints && m.health_constraints.length) {
        bits.push(list(m.health_constraints, "tag-strong"));
      }
      if (m.allergies && m.allergies.length) {
        bits.push("allergic to " + list(m.allergies, "tag-strong"));
      }
      if (m.dietary_preferences && m.dietary_preferences.length) {
        bits.push(list(m.dietary_preferences, "tags"));
      }
      if (m.dislikes && m.dislikes.length) { bits.push("dislikes " + list(m.dislikes, "tags")); }
      html += '<span class="tags">' + bits.join(" · ") + "</span></div>";
    });
    html += "</div>";

    html += '<div class="sec"><h3>Active preferences</h3>';
    if (ctx.active_preference_signals.length) {
      ctx.active_preference_signals.forEach(function (s) {
        html += '<div class="signal">' + esc(s.signal);
        if (s.expires_on) { html += ' <span class="when">until ' + esc(s.expires_on) + "</span>"; }
        else { html += ' <span class="when">standing</span>'; }
        html += "</div>";
      });
    } else {
      html += '<p class="note">None on file.</p>';
    }
    html += "</div>";

    if (ctx.expired_preference_signals.length) {
      html += '<div class="sec"><h3>Expired</h3>';
      ctx.expired_preference_signals.forEach(function (s) {
        html += '<div class="signal expired"><s>' + esc(s.signal) + "</s>" +
                ' <span class="when">expired ' + esc(s.expires_on) +
                " — not sent to the model</span></div>";
      });
      html += "</div>";
    }
    return html + "</div>";
  }

  function dashboardMarkup(budget, inventory) {
    var html = '<div class="panel">';
    html += '<p class="block-title">Reader’s dashboard</p>';
    html += '<p class="block-why">Not part of the model prompt. Shown so the spend tier and the deductions below are legible.</p>';

    html += '<div class="sec"><h3>Budget this month</h3>';
    if (budget) {
      var remaining = Math.max(budget.monthly_limit - budget.spent_amount - budget.planned_amount, 0);
      html += '<div class="money"><span>Limit</span><b>' + money(budget.monthly_limit) + "</b></div>";
      html += '<div class="money"><span>Spent</span><b>' + money(budget.spent_amount) + "</b></div>";
      html += '<div class="money"><span>Planned</span><b>' + money(budget.planned_amount) + "</b></div>";
      html += '<div class="money"><span>Remaining</span><b>' + money(remaining) + "</b></div>";
    } else {
      html += '<p class="note">No budget on file — spend is unconstrained.</p>';
    }
    html += "</div>";

    html += '<div class="sec"><h3>In the kitchen</h3><div id="stock">';
    if (inventory.length) {
      inventory.forEach(function (lot) {
        html += '<div class="stock" data-lot="' + esc(lot.id) + '"><span>' + esc(lot.ingredient) +
                '</span><span class="q">' + esc(lot.quantity) + " " + esc(lot.unit) + "</span></div>";
      });
    } else {
      html += '<p class="note">Empty.</p>';
    }
    html += "</div></div>";
    return html + "</div>";
  }

  // -- generate --------------------------------------------------------

  async function generate() {
    var hid = selectedHousehold();
    if (hid === null) { fail("Pick a household first."); return; }
    goBtn.disabled = true;
    right.innerHTML = "";
    setStatus("Starting a loop…", true);
    try {
      var loopResponse = await fetch("/api/households/" + hid + "/loops", {
        method: "POST", headers: headers(), body: JSON.stringify({ trigger_type: "manual" })
      });
      if (!loopResponse.ok) { throw new Error(await detail(loopResponse)); }
      var loop = await loopResponse.json();

      setStatus("Asking the model for a recipe…", true);
      var body = {
        servings: Number($("servings").value),
        guests: Number($("guests").value),
        available_minutes: Number($("minutes").value),
        urgency: $("urgency").value
      };
      var response = await fetch("/api/v2/households/" + hid + "/loops/" + loop.id + "/recipe", {
        method: "POST", headers: headers(), body: JSON.stringify(body)
      });
      if (!response.ok) { throw new Error(await detail(response)); }
      var data = await response.json();

      rememberKey();
      setStatus("Generated by " + data.generation_provider + ".");
      renderRight(data, hid, loop.id);
    } catch (error) {
      fail(error.message || String(error));
    } finally {
      goBtn.disabled = false;
    }
  }

  // -- right pane ------------------------------------------------------
  //
  // Two render roots, not one. The left pane re-renders on its own after a
  // cook, and it must not be able to destroy the right pane's event
  // listeners to do it. Within each root the original rule still holds:
  // build one string, assign it once, then hydrate through SEPARATE
  // functions, so an early return in one hydrator cannot skip another --
  // the bug that existed when the audio guard lived inline in render().

  function renderRight(data, hid, loopId) {
    right.innerHTML = recipeMarkup(data) + cookedPanelMarkup(data);
    hydrateAudio(data, hid, loopId);
    hydrateCookedPanel(data, hid, loopId);
  }

  function recipeMarkup(data) {
    var r = data.recipe;
    var html = '<div class="panel recipe">';
    html += "<h2>" + esc(r.title) + "</h2>";
    html += '<p class="meta">Serves ' + esc(r.servings) + " · about " + esc(r.prep_minutes) +
            " minutes · " + Math.round(data.availability_ratio * 100) + "% already in the kitchen</p>";

    if (data.missing_ingredients.length) {
      html += '<div class="missing"><strong>Not in the kitchen:</strong><ul>';
      data.missing_ingredients.forEach(function (m) {
        html += "<li>" + esc(m.ingredient) +
                (m.quantity_unknown ? "" : " — " + esc(m.missing_quantity) + " " + esc(m.unit)) + "</li>";
      });
      html += "</ul></div>";
    }

    html += '<div class="sec"><h3>Ingredients</h3><ul>';
    r.ingredients.forEach(function (i) {
      html += "<li>" + esc(i.quantity) + " " + esc(i.unit) + " " + esc(i.ingredient) + "</li>";
    });
    html += "</ul></div>";

    if (r.assumed_pantry_staples.length) {
      html += '<div class="sec"><h3>Assumed on hand</h3><p class="note">' +
              r.assumed_pantry_staples.map(esc).join(", ") + "</p></div>";
    }

    html += '<div class="sec"><h3>Steps</h3><ol>';
    r.steps.forEach(function (s) { html += "<li>" + esc(s) + "</li>"; });
    html += "</ol></div>";

    html += '<div class="sec"><h3>Nutrition</h3><ul>';
    r.nutrition_notes.forEach(function (n) { html += "<li>" + esc(n) + "</li>"; });
    html += "</ul></div>";

    html += '<div class="sec"><h3>Procurement</h3><p><span class="chip">' + esc(data.tier) +
            '</span><span class="chip">' + esc(data.procurement_path) + "</span></p>" +
            '<p class="note">' + esc(data.procurement_reason) + "</p></div>";

    html += '<div class="sec"><h3>Audio briefing</h3><div id="audio-slot"></div></div>';
    html += '<details class="sec"><summary>Raw response</summary><pre>' +
            esc(JSON.stringify(data, null, 2)) + "</pre></details>";
    return html + "</div>";
  }

  function hydrateAudio(data, hid, loopId) {
    var slot = $("audio-slot");
    if (!slot) { return; }
    if (!data.audio_id) {
      // Deliberately not an early return out of renderRight(): this used to
      // bail before anything below it was wired up, so a household whose
      // cook language has no configured voice silently lost the rest of the
      // page.
      slot.innerHTML = '<p class="note">No voice is configured for this cook’s language, ' +
                       "so this recipe is text only.</p>";
      return;
    }
    var button = document.createElement("button");
    button.className = "ghost";
    button.textContent = "▶ Read it to me";
    var note = document.createElement("p");
    note.className = "note";
    note.style.marginTop = "8px";
    slot.appendChild(button);
    slot.appendChild(note);

    button.addEventListener("click", async function () {
      button.disabled = true;
      note.innerHTML = '<span class="spinner"></span> Rewriting and synthesising…';
      try {
        var response = await fetch(
          "/api/v2/households/" + hid + "/loops/" + loopId + "/recipe-audio/" + data.audio_id,
          { headers: headers() }
        );
        if (!response.ok) { throw new Error(await detail(response)); }
        var blob = await response.blob();
        var player = document.createElement("audio");
        player.controls = true;
        player.src = URL.createObjectURL(blob);
        slot.replaceChild(player, button);
        note.textContent = "";
        player.play().catch(function () { /* autoplay blocked; controls are there */ });
      } catch (error) {
        button.disabled = false;
        note.innerHTML = '<span class="err">' + esc(error.message) +
                         "</span><br />The recipe above is unchanged — text is always available.";
      }
    });
  }

  // -- "I cooked this" -------------------------------------------------
  //
  // The quantities are the recipe's own. There is nothing to edit here: the
  // agent knows what it asked for, and the server decides what can actually
  // be deducted -- it refuses to deduct across units it cannot convert and
  // reports the mismatch instead of guessing.

  function cookedPanelMarkup(data) {
    var html = '<div class="panel" id="cooked-panel">';
    html += "<h2>I cooked this</h2>";
    html += '<p class="sub" style="margin-bottom:16px">Closes the loop: writes it to history and takes the ingredients out of the kitchen.</p>';

    html += '<div class="sec"><h3>Will come out of the kitchen</h3><ul>';
    data.recipe.ingredients.forEach(function (i) {
      html += "<li>" + esc(i.quantity) + " " + esc(i.unit) + " " + esc(i.ingredient) + "</li>";
    });
    html += "</ul></div>";

    // Defaulted and folded away, so the primary path is one button. <details>
    // keeps its contents in the DOM when closed, so these read fine unopened.
    html += '<details class="sec"><summary>Add detail</summary>';
    html += '<div class="row" style="margin-top:12px">';
    html += '<div class="field" style="flex:2 1 220px"><label for="ck-dish">Dish</label>' +
            '<input id="ck-dish" type="text" value="' + esc(data.recipe.title) + '" /></div>';
    html += '<div class="field"><label for="ck-rating">Rating</label><select id="ck-rating">' +
            '<option value="">—</option><option>1</option><option>2</option><option>3</option>' +
            "<option>4</option><option selected>5</option></select></div>";
    html += '<div class="field"><label for="ck-left">Leftover portions</label>' +
            '<input id="ck-left" type="number" min="0" step="any" value="0" /></div>';
    html += "</div>";
    html += '<div class="row" style="margin-top:12px"><div class="field" style="flex:1 1 100%">' +
            '<label for="ck-feedback">How did it go?</label>' +
            '<textarea id="ck-feedback" rows="2" placeholder="optional"></textarea></div></div>';
    html += '<p style="margin:14px 0 0"><label style="text-transform:none;letter-spacing:0;font-size:0.9rem">' +
            '<input id="ck-mishap" type="checkbox" style="width:auto;margin-right:8px" />' +
            "Something went wrong (records it as not accepted)</label></p>";
    html += "</details>";

    html += '<div class="actions"><button id="ck-submit">I cooked this</button>' +
            '<span id="ck-note" class="note"></span></div>';
    return html + "</div>";
  }

  function hydrateCookedPanel(data, hid, loopId) {
    var panel = $("cooked-panel");
    if (!panel) { return; }
    var submit = $("ck-submit");
    var note = $("ck-note");

    submit.addEventListener("click", async function () {
      // ConsumedItem.quantity is gt=0, so a zero row would 422 the whole
      // submission. Recipes should not contain one, but the filter costs
      // nothing and the failure would be total.
      var consumed = data.recipe.ingredients
        .filter(function (i) { return Number(i.quantity) > 0; })
        .map(function (i) {
          return { name: i.ingredient, quantity: Number(i.quantity), unit: i.unit };
        });

      var rating = $("ck-rating").value;
      var payload = {
        dish_name: $("ck-dish").value.trim() || data.recipe.title,
        rating: rating ? Number(rating) : null,
        feedback: $("ck-feedback").value,
        leftovers_portions: Number($("ck-left").value) || 0,
        mishap: $("ck-mishap").checked,
        consumed: consumed
      };

      submit.disabled = true;
      note.className = "note";
      note.innerHTML = '<span class="spinner"></span> Closing…';
      try {
        var response = await fetch("/api/households/" + hid + "/loops/" + loopId + "/outcome", {
          method: "POST", headers: headers(), body: JSON.stringify(payload)
        });
        if (!response.ok) { throw new Error(await detail(response)); }
        var body = await response.json();

        // capture_outcome does not validate loop state, so a second submit
        // would write a duplicate history row and a second audit event.
        // Staying disabled is the only thing preventing that.
        submit.textContent = "Loop closed";
        note.textContent = "";
        showDeductions(panel, body.deducted, body.skipped);
        refreshLeft();
      } catch (error) {
        submit.disabled = false;
        note.innerHTML = '<span class="err">' + esc(error.message) +
                         "</span><br />Nothing was written — the loop is still open.";
      }
    });
  }

  function showDeductions(panel, deducted, skipped) {
    // Rendered from the server's own answer rather than by diffing two
    // inventory snapshots. The server is the authority on what it deducted,
    // and re-fetching to diff would race the demo reseed job.
    var block = document.createElement("div");
    block.className = "sec";
    var html = "<h3>Kitchen updated</h3>";

    if (deducted.length) {
      html += '<div class="missing">' + deducted.map(function (d) {
        return esc(d.ingredient) + ": " + esc(d.before) + " → " + esc(d.after) + " " + esc(d.unit);
      }).join("<br />") + "</div>";
    } else {
      html += '<p class="note">Nothing was deducted.</p>';
    }

    if (skipped.length) {
      html += '<p class="note" style="margin-top:10px">' + skipped.map(function (s) {
        if (s.reason === "unit_mismatch") {
          return esc(s.ingredient) + " — " + esc(s.stock_quantity) + " " + esc(s.stock_unit) +
                 " in stock, recipe asks " + esc(s.requested_quantity) + " " + esc(s.requested_unit) +
                 " (not deducted: units don’t match)";
        }
        if (s.reason === "insufficient_stock") {
          return esc(s.ingredient) + " — ran out, " + esc(s.shortfall) + " " +
                 esc(s.requested_unit) + " short";
        }
        return esc(s.ingredient) + " — not in inventory, nothing deducted";
      }).join("<br />") + "</p>";
    }

    block.innerHTML = html;
    panel.appendChild(block);
  }

  goBtn.addEventListener("click", generate);
  householdSel.addEventListener("change", function () { right.innerHTML = ""; refreshLeft(); });
  // A 401 before a key is typed is the expected first state on a deployed
  // instance, so the picker retries itself instead of demanding a reload.
  $("apikey").addEventListener("change", function () {
    rememberKey();
    if (!selectedHousehold()) { loadHouseholds(); } else { refreshLeft(); }
  });

  loadHouseholds();
})();
</script>
</body>
</html>
